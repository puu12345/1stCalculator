<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เครื่องคิดเลข</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@600&family=Prompt:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --font-thai: 'Prompt', sans-serif;
      --font-digits: 'JetBrains Mono', Consolas, monospace;
    }
    body {
      font-family: var(--font-thai);
      background: #f0f2f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .calculator {
      background: #fff;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
      width: 300px;
    }
    #display {
      width: 100%;
      box-sizing: border-box;
      font-family: var(--font-digits);
      font-size: 28px;
      font-weight: 600;
      color: #222;
      padding: 10px;
      text-align: right;
      border: 1px solid #ccc;
      border-radius: 8px;
    }
    #display::placeholder {
      font-family: var(--font-thai);
      font-weight: 400;
      font-size: 20px;
    }
    #result {
      min-height: 32px;
      margin: 10px 0;
      font-size: 20px;
      text-align: right;
      color: #333;
      padding: 8px 12px;
      border-radius: 8px;
      box-sizing: border-box;
    }
    #result:empty { padding: 0; }
    #result.special { background: #d4edda; color: #155724; }
    #result.normal { background: #fce4ec; color: #880e4f; font-family: var(--font-digits); font-weight: 600; }
    #result.error { background: #f8d7da; color: #721c24; border-left: 4px solid #dc3545; }
    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }
    button {
      font-size: 20px;
      padding: 14px 0;
      border: none;
      border-radius: 8px;
      background: #e4e6eb;
      cursor: pointer;
    }
    button:hover { background: #d0d3d9; }
    .op { background: #ffb347; }
    .eq { background: #4caf50; color: #fff; }
    .clear { background: #f44336; color: #fff; }
  </style>
</head>
<body>
  <div class="calculator">
    <h2>เครื่องคิดเลข</h2>
    <input id="display" type="text" placeholder="พิมพ์ เช่น 1+1">
    <div id="result"></div>
    <div class="buttons">
      <button class="clear" onclick="clearAll()">C</button>
      <button onclick="press('(')">(</button>
      <button onclick="press(')')">)</button>
      <button class="op" onclick="press('/')">÷</button>

      <button onclick="press('7')">7</button>
      <button onclick="press('8')">8</button>
      <button onclick="press('9')">9</button>
      <button class="op" onclick="press('*')">×</button>

      <button onclick="press('4')">4</button>
      <button onclick="press('5')">5</button>
      <button onclick="press('6')">6</button>
      <button class="op" onclick="press('-')">−</button>

      <button onclick="press('1')">1</button>
      <button onclick="press('2')">2</button>
      <button onclick="press('3')">3</button>
      <button class="op" onclick="press('+')">+</button>

      <button onclick="press('0')">0</button>
      <button onclick="press('.')">.</button>
      <button onclick="backspace()">⌫</button>
      <button class="eq" onclick="calculate()">=</button>
    </div>
  </div>

  <script>
    const display = document.getElementById('display');
    const result = document.getElementById('result');

    function press(value) {
      display.value += value;
    }

    // type: 'special' = เขียวอ่อน, 'normal' = ชมพู, 'error' = แดงอ่อน
    function showResult(text, type) {
      result.textContent = text;
      result.className = type || '';
    }

    function clearAll() {
      display.value = '';
      showResult('');
    }

    function backspace() {
      display.value = display.value.slice(0, -1);
    }

    function calculate() {
      const expression = display.value.replace(/\s+/g, '');

      // กรณีพิเศษ
      if (expression === '1+1') {
        showResult('1+1 ไม่ต้องเท่ากับ 2 ก็ได้', 'special');
        return;
      }

      // อนุญาตเฉพาะตัวเลข เครื่องหมาย + - * / . และวงเล็บ
      if (!/^[0-9+\-*/.()]+$/.test(expression)) {
        showResult('ใส่ได้เฉพาะตัวเลขและเครื่องหมาย + - × ÷', 'error');
        return;
      }

      try {
        const answer = Function('"use strict"; return (' + expression + ')')();
        if (!isFinite(answer)) {
          showResult('คำนวณไม่ได้', 'error');
        } else {
          showResult('= ' + answer, 'normal');
        }
      } catch (e) {
        showResult('สูตรไม่ถูกต้อง', 'error');
      }
    }

    // กด Enter เพื่อคำนวณ
    display.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') calculate();
    });
  </script>
</body>
</html>
